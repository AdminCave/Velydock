# Velydock's wording for the e-mails Keycloak sends. {5} in the invitation is the user name
# (passed by this theme's executeActions templates). No apostrophes: they are special here.
executeActionsSubject=Dein Zugang: noch ein Schritt
executeActionsBody=Hallo,\n\nf\u00fcr dein Konto bei {2} steht noch ein Schritt aus: {3}.\n\nDein Benutzername: {5}\n\n\u00d6ffne dazu diesen Link:\n{0}\n\nDer Link ist {4} g\u00fcltig. Ist er abgelaufen, schickt dir deine Administration einen neuen.\n\nKannst du mit dieser Nachricht nichts anfangen, ignoriere sie einfach \u2013 dann \u00e4ndert sich nichts.
executeActionsBodyHtml=<p>Hallo,</p><p>f\u00fcr dein Konto bei {2} steht noch ein Schritt aus: {3}.</p><p>Dein Benutzername: <strong>{5}</strong></p><p><a href="{0}">Jetzt erledigen</a></p><p>Der Link ist {4} g\u00fcltig. Ist er abgelaufen, schickt dir deine Administration einen neuen.</p><p>Kannst du mit dieser Nachricht nichts anfangen, ignoriere sie einfach \u2013 dann \u00e4ndert sich nichts.</p>
passwordResetSubject=Passwort zur\u00fccksetzen
passwordResetBody=Hallo,\n\nf\u00fcr dein Konto bei {2} wurde ein neues Passwort angefordert. Wenn du das warst, \u00f6ffne diesen Link:\n\n{0}\n\nDer Link ist {3} g\u00fcltig.\n\nWenn du das nicht warst, ignoriere diese Nachricht \u2013 dein Passwort bleibt, wie es ist.
passwordResetBodyHtml=<p>Hallo,</p><p>f\u00fcr dein Konto bei {2} wurde ein neues Passwort angefordert. Wenn du das warst:</p><p><a href="{0}">Neues Passwort festlegen</a></p><p>Der Link ist {3} g\u00fcltig.</p><p>Wenn du das nicht warst, ignoriere diese Nachricht \u2013 dein Passwort bleibt, wie es ist.</p>
requiredAction.UPDATE_PASSWORD=ein eigenes Passwort festlegen
