# Velydock's wording for the e-mails Keycloak sends. {5} in the invitation is the user name
# (passed by this theme's executeActions templates). No apostrophes: they are special here.
executeActionsSubject=Your account: one more step
executeActionsBody=Hello,\n\none step is still open for your account at {2}: {3}.\n\nYour user name: {5}\n\nOpen this link to do it:\n{0}\n\nThe link is valid for {4}. If it has expired, your administrator can send you a new one.\n\nIf this message means nothing to you, just ignore it \u2013 nothing will change.
executeActionsBodyHtml=<p>Hello,</p><p>one step is still open for your account at {2}: {3}.</p><p>Your user name: <strong>{5}</strong></p><p><a href="{0}">Do it now</a></p><p>The link is valid for {4}. If it has expired, your administrator can send you a new one.</p><p>If this message means nothing to you, just ignore it \u2013 nothing will change.</p>
passwordResetSubject=Reset your password
passwordResetBody=Hello,\n\na new password was requested for your account at {2}. If that was you, open this link:\n\n{0}\n\nThe link is valid for {3}.\n\nIf it was not you, ignore this message \u2013 your password stays as it is.
passwordResetBodyHtml=<p>Hello,</p><p>a new password was requested for your account at {2}. If that was you:</p><p><a href="{0}">Set a new password</a></p><p>The link is valid for {3}.</p><p>If it was not you, ignore this message \u2013 your password stays as it is.</p>
requiredAction.UPDATE_PASSWORD=set a password of your own
