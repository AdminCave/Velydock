# Traefik routing for Velydock (file provider – no access to the Docker socket needed).
# Values come from the environment of the traefik container; see docker-compose.yml.
#
# The directory this file lies in is mounted into the container as a whole and watched: a changed
# file (for example after `git pull`) is applied without restarting Traefik. Only files directly
# in this directory are watched, so routes must not move into a sub-directory.

http:
  routers:
    velydock:
      # The main host and the sandbox host end up in the same container, which tells them apart
      # by host name. Custom apps are only ever served on the sandbox host.
      rule: "Host(`{{ env "VELYDOCK_HOST" }}`) || Host(`{{ env "SANDBOX_HOST" }}`)"
      entryPoints: [websecure]
      service: velydock
      middlewares: [compress]
      tls:
{{- if env "TLS_RESOLVER" }}
        certResolver: {{ env "TLS_RESOLVER" }}
{{- else }}
        {}
{{- end }}

    velydock-api:
      # The API additionally gets a per-client rate limit (sign-in attempts themselves are
      # throttled by Keycloak's brute-force protection). So does /proxy/login, where browsers
      # on their way to a published app arrive: it can be called without a sign-in.
      rule: "Host(`{{ env "VELYDOCK_HOST" }}`) && (PathPrefix(`/api/`) || PathPrefix(`/proxy/`))"
      # Must be set: without it Traefik prefers the router with the longer rule text, which is
      # "velydock" above for every sandbox host name of 11 or more characters – the rate limit
      # would never apply. Any value above the length of that rule will do.
      priority: 1000
      entryPoints: [websecure]
      service: velydock
      middlewares: [api-ratelimit, compress]
      tls:
{{- if env "TLS_RESOLVER" }}
        certResolver: {{ env "TLS_RESOLVER" }}
{{- else }}
        {}
{{- end }}

    keycloak:
      # Only what browsers need: the Velydock realm and static resources. The admin console, the
      # admin API and the master realm stay unreachable from outside.
      rule: "Host(`{{ env "KEYCLOAK_HOST" }}`) && (PathPrefix(`/realms/{{ env "KEYCLOAK_REALM" }}/`) || PathPrefix(`/resources/`))"
      entryPoints: [websecure]
      service: keycloak
      middlewares: [compress]
      tls:
{{- if env "TLS_RESOLVER" }}
        certResolver: {{ env "TLS_RESOLVER" }}
{{- else }}
        {}
{{- end }}

    keycloak-signin:
      # Where Keycloak checks passwords, one-time codes and client secrets: the steps of the
      # sign-in forms and the token endpoint. They get their own per-client rate limit; the rest
      # of the realm (the sign-in page itself, static resources, discovery documents, keys)
      # stays on the router above without one.
      rule: "Host(`{{ env "KEYCLOAK_HOST" }}`) && (PathPrefix(`/realms/{{ env "KEYCLOAK_REALM" }}/login-actions/`) || PathPrefix(`/realms/{{ env "KEYCLOAK_REALM" }}/protocol/openid-connect/token`))"
      # Both Keycloak routers match these paths. This rule is the longer text and would win
      # without a priority as well – it is set so that a later change to either rule cannot
      # switch the limit off unnoticed (see "velydock-api").
      priority: 1000
      entryPoints: [websecure]
      service: keycloak
      middlewares: [signin-ratelimit, compress]
      tls:
{{- if env "TLS_RESOLVER" }}
        certResolver: {{ env "TLS_RESOLVER" }}
{{- else }}
        {}
{{- end }}

  middlewares:
    compress:
      compress: {}
    # Per client address. Generous on purpose: a whole office usually shares one address, and
    # one page load is a handful of calls plus one per uploaded app icon.
    api-ratelimit:
      rateLimit:
        average: 100
        burst: 300
        period: 1s
    # Per client address as well. One sign-in is 2 to 7 requests to these paths (user name,
    # password, second factor, each followed by a redirect; more when a password has to be
    # changed), so an office behind one address can sign in together, while guessing passwords
    # from one address stops being fast. It does not replace Keycloak's brute-force protection.
    signin-ratelimit:
      rateLimit:
        average: 20
        burst: 60
        period: 1s

  services:
    velydock:
      loadBalancer:
        servers:
          - url: "http://velydock:8000"
    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"

tls:
  options:
    default:
      minVersion: VersionTLS12
