# Traefik routing for Velydock (file provider – no access to the Docker socket needed).
# Values come from the environment of the traefik container; see docker-compose.yml.
#
# The directory this file lies in is mounted into the container as a whole and watched: a changed
# file (for example after `git pull`) is applied without restarting Traefik. Only files directly
# in this directory are watched, so routes must not move into a sub-directory.

http:
  routers:
    velydock:
      # The main host and the sandbox host end up in the same container, which tells them apart
      # by host name. Custom apps are only ever served on the sandbox host.
      rule: "Host(`{{ env "VELYDOCK_HOST" }}`) || Host(`{{ env "SANDBOX_HOST" }}`)"
      entryPoints: [websecure]
      service: velydock
      middlewares: [compress]
      tls:
{{- if env "TLS_RESOLVER" }}
        certResolver: {{ env "TLS_RESOLVER" }}
{{- else }}
        {}
{{- end }}

    velydock-api:
      # The API additionally gets a per-client rate limit (sign-in attempts themselves are
      # throttled by Keycloak's brute-force protection).
      rule: "Host(`{{ env "VELYDOCK_HOST" }}`) && PathPrefix(`/api/`)"
      # Must be set: without it Traefik prefers the router with the longer rule text, which is
      # "velydock" above for every sandbox host name of 11 or more characters – the rate limit
      # would never apply. Any value above the length of that rule will do.
      priority: 1000
      entryPoints: [websecure]
      service: velydock
      middlewares: [api-ratelimit, compress]
      tls:
{{- if env "TLS_RESOLVER" }}
        certResolver: {{ env "TLS_RESOLVER" }}
{{- else }}
        {}
{{- end }}

    keycloak:
      # Only what browsers need: the Velydock realm and static resources. The admin console, the
      # admin API and the master realm stay unreachable from outside.
      rule: "Host(`{{ env "KEYCLOAK_HOST" }}`) && (PathPrefix(`/realms/{{ env "KEYCLOAK_REALM" }}/`) || PathPrefix(`/resources/`))"
      entryPoints: [websecure]
      service: keycloak
      middlewares: [compress]
      tls:
{{- if env "TLS_RESOLVER" }}
        certResolver: {{ env "TLS_RESOLVER" }}
{{- else }}
        {}
{{- end }}

  middlewares:
    compress:
      compress: {}
    # Per client address. Generous on purpose: a whole office usually shares one address, and
    # one page load is a handful of calls plus one per uploaded app icon.
    api-ratelimit:
      rateLimit:
        average: 100
        burst: 300
        period: 1s

  services:
    velydock:
      loadBalancer:
        servers:
          - url: "http://velydock:8000"
    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"

tls:
  options:
    default:
      minVersion: VersionTLS12
