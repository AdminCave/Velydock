name: Release

# A version tag (v1.2.3) publishes the container image to GHCR and a GitHub release with what an
# installation needs: install.sh, the bundle velydock-<version>.tar.gz and SHA256SUMS.
#
# Nothing is built or pushed before the job "gate" has passed: the tag has the form of a version,
# the tagged commit is on main, CI succeeded for exactly that commit, and the release files can
# be built from it. A tag that was pushed too early (CI still running) fails there; run the
# workflow again once CI is through.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  gate:
    name: May this tag be released?
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the question below is whether the tagged commit is part of main.
          fetch-depth: 0
      - name: The tag has the form of a version
        run: |
          # The same form scripts/make-bundle.sh accepts; "v*.*.*" above lets more through.
          if [[ ! $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$GITHUB_REF_NAME' is not a version tag (v1.2.3 or v1.2.3-rc.1)."
            exit 1
          fi
      - name: The tagged commit is on main
        run: |
          # The commit that was checked out for the tag (for an annotated tag, not the tag object).
          commit=$(git rev-parse 'HEAD^{commit}')
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to $commit, which is not on main."
            exit 1
          fi
      - name: CI succeeded for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse 'HEAD^{commit}')
          succeeded=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$commit" \
            --status success --json databaseId --jq length)
          if [[ ! $succeeded =~ ^[0-9]+$ ]] || (( succeeded < 1 )); then
            echo "::error::no successful run of the CI workflow for $commit."
            exit 1
          fi
      - name: The release files can be built
        run: |
          # With a digest of zeros in place of the real one, which exists only after the image
          # is pushed. Whatever make-bundle.sh would refuse, it refuses here - before the push.
          version=${GITHUB_REF_NAME#v}
          ./scripts/make-bundle.sh "$version" "ghcr.io/admincave/velydock:$version@sha256:$(printf '%064d' 0)" "$RUNNER_TEMP/dry-run"

  image:
    name: Build and publish the image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: gate
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/admincave/velydock
          # v1.2.3 gives 1.2.3, 1.2 and latest. A pre-release (v1.3.0-rc.1) gives only 1.3.0-rc.1:
          # the action adds "latest" by itself, and only for a full release. Do not add it here as
          # a raw tag – installations follow "latest" and would be moved to a release candidate.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A release is built from scratch on the current base images: a cached layer would
          # carry the system packages of an earlier build, without the security fixes since.
          pull: true
          no-cache: true

  release:
    name: Publish the release (installer, bundle, checksums)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Only once the image is there: the bundle names it by its digest, and whoever installs the
    # release pulls exactly that image.
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the bundle and the checksums
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "error: the image job reported no digest ('$DIGEST')." >&2
            exit 1
          fi
          ./scripts/make-bundle.sh "$version" "ghcr.io/admincave/velydock:$version@$DIGEST" release
          cat release/SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          options=(--title "Velydock $version" --generate-notes --verify-tag)
          # v1.3.0-rc.1 becomes a pre-release. "releases/latest", which the one-line installation
          # and "velydock update" follow, stays at the last full release.
          if [[ $version == *-* ]]; then options+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" "${options[@]}" \
            release/install.sh "release/velydock-$version.tar.gz" release/SHA256SUMS
