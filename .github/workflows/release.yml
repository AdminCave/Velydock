name: Release

# Publishes the container image to GHCR when a version tag (v1.2.3) is pushed.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/admincave/velydock
          # v1.2.3 gives 1.2.3, 1.2 and latest. A pre-release (v1.3.0-rc.1) gives only 1.3.0-rc.1:
          # the action adds "latest" by itself, and only for a full release. Do not add it here as
          # a raw tag – installations follow "latest" and would be moved to a release candidate.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
