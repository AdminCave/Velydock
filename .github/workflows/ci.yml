name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: ./scripts/dev-stack.sh

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies (pinned, verified by hash)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy velydock
      - name: API description is up to date
        run: velydock openapi | diff - openapi.json
      - name: Start PostgreSQL, Keycloak and the mail catcher
        working-directory: .
        # Keycloak normally waits for the "theme" container, which needs the built image; the
        # backend tests do not need the theme.
        run: $COMPOSE up -d --no-deps --wait postgres keycloak mail
      - name: Tests (unit, API with PostgreSQL, security, real Keycloak)
        run: pytest -q
      - name: Logs on failure
        if: failure()
        working-directory: .
        run: $COMPOSE logs --no-color --tail 200 postgres keycloak mail

  frontend:
    name: Frontend (check, lint, unit tests, build)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run check
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: End-to-end (complete Docker stack in a browser)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build the image and start the stack
        run: $COMPOSE up -d --build --wait
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: e2e
        run: npx playwright test
      - name: Backup and restore round trip
        run: bash scripts/tests/backup-restore.sh
      - name: Installation as documented (production Compose file, first administrator with second factor)
        run: bash scripts/tests/install-smoke.sh
      - name: Certificates at the real proxy (fetched from an ACME test server, and own ones)
        run: bash scripts/tests/tls-modes.sh
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  installer:
    name: Installer (as root on the runner, from a local release)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Shell scripts are clean
        run: |
          # Usually part of the runner image; installed when it is not.
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          shellcheck install.sh scripts/velydock scripts/*.sh scripts/tests/*.sh
      - name: Build the image
        run: docker build -t velydock:dev .
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: What needs root on a fresh system, in containers (Docker's packages on Debian and Ubuntu; launcher, timer and log with stand-ins)
        run: bash scripts/tests/installer-system.sh
      # The real thing: the installer as root with its defaults - /opt/velydock, ports 80 and
      # 443, /usr/local/bin/velydock, the systemd timer for backups - then the first sign-in in
      # a browser, backup, update to a second version, restore, uninstall and purge. The script
      # calls sudo itself where a real administrator would.
      - name: Installer as root (install, sign in, back up, update, restore, uninstall)
        env:
          INSTALLER_TEST_MODE: system
        run: bash scripts/tests/installer.sh
      - name: State on failure
        if: failure()
        run: |
          docker ps -a
          sudo tail -n 200 /var/log/velydock-install.log || true
          sudo journalctl -u velydock-backup.service --no-pager -n 50 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: installer-playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
