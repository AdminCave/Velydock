# Local development and test stack. Always use it under its own project name, so it can never
# touch the containers or volumes of a real installation on the same machine:
#
#   docker compose -p velydock-dev --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# (scripts/dev-stack.sh wraps this.) Differences to production: the image is built from this
# checkout, TLS uses Traefik's self-signed certificate, PostgreSQL and Keycloak are reachable on
# localhost for the test suites, a small demo web app is available to embed, and a mail catcher
# receives whatever Keycloak sends.

services:
  traefik:
    environment:
      # Switches on the route in deploy/traefik/dynamic/dev-demo.yml. That directory is mounted
      # exactly as in production; without this variable the file renders to nothing.
      DEMO_HOST: demo.velydock.localhost
    ports: !override
      - "127.0.0.1:${DEV_HTTPS_PORT:-8443}:443"

  velydock:
    build: .
    image: ${VELYDOCK_DEV_IMAGE:-velydock:dev}
    environment:
      VELYDOCK_ENVIRONMENT: development

  theme:
    build: .
    image: ${VELYDOCK_DEV_IMAGE:-velydock:dev}

  keycloak:
    environment:
      # Keycloak's administration console at http://localhost:18080/admin/ (as with
      # docker-compose.keycloak-admin.yml in production).
      KC_HOSTNAME_ADMIN: http://localhost:${DEV_KEYCLOAK_PORT:-18080}
    ports:
      - "127.0.0.1:${DEV_KEYCLOAK_PORT:-18080}:8080"

  postgres:
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-15432}:5432"
    networks: !override
      - internal
      - edge

  # Echoes the request it receives; sets no framing restrictions, so it can be embedded.
  demo:
    image: traefik/whoami:v1.11.0
    restart: unless-stopped
    networks: [edge]

  # Catches every e-mail sent in development and tests; nothing leaves the machine. Configure it
  # in Velydock under "Systemeinstellungen" as server "mail", port 1025, no encryption.
  # Inbox and API: http://localhost:18025
  mail:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:${DEV_MAIL_PORT:-18025}:8025"
    networks: [internal, edge]
