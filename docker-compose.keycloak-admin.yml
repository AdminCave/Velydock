# Opens Keycloak's own administration console on localhost of the server, for use through an
# SSH tunnel. Needed for tasks Velydock does not cover: connecting apps via OIDC, LDAP/AD,
# external identity providers. See docs/betrieb.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.keycloak-admin.yml up -d --wait keycloak
#   docker compose exec velydock velydock keycloak-admin --username <your Velydock user>
#   ssh -L 8081:127.0.0.1:8081 <server>   then open http://localhost:8081/admin/velydock/console/
#
# With your own reverse proxy (docker-compose.override.yml) name that file as well: with explicit
# -f options Compose no longer loads it by itself, and Keycloak would lose the port of your proxy.
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#                  -f docker-compose.keycloak-admin.yml up -d --wait keycloak
#
# Keycloak restarts for this; --wait returns when it answers again, which the second command
# needs. Close the console again with a plain `docker compose up -d`.

services:
  keycloak:
    environment:
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_PORT:-8081}
    ports:
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8081}:8080"
