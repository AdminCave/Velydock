# Next to the production stack for scripts/tests/tls-modes.sh: an ACME authority of our own
# (Pebble, the test server of Let's Encrypt). The proxy orders its certificates there, and Pebble
# checks the names over HTTP on port 80 of the proxy, which it finds under the names of the
# installation (network aliases) - the same exchange as with Let's Encrypt, without the internet.
services:
  pebble:
    image: ghcr.io/letsencrypt/pebble@sha256:0c81f05db371f436c97fb894bd6d2ab8fc9c8e2ce40f8bef8a8e15941bcd75ef
    command: ["-config", "/cfg/pebble-config.json"]
    environment:
      # No random waiting and no rejected nonces: this test is about the proxy, not about
      # how well an ACME client copes.
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    volumes:
      - ${TLS_TEST_DIR:?}/pebble:/cfg:ro
    networks: [edge]

  traefik:
    environment:
      # The authority's own address is served with a certificate of Pebble's test root.
      LEGO_CA_CERTIFICATES: /pebble/pebble.minica.pem
    volumes:
      - ${TLS_TEST_DIR:?}/pebble/pebble.minica.pem:/pebble/pebble.minica.pem:ro
    depends_on:
      pebble:
        condition: service_started
    networks:
      edge:
        aliases: [dock.tls.test, auth.tls.test, sandbox.tls.test, apps.tls.test]
